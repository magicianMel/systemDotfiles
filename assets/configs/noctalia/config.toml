[osd.kinds]
brightness = false
keyboard_backlight = false
lock_keys = false
media = false
power_profile = false

[plugins]
enabled = [ "noctalia/kaomoji" ]

[shell]
avatar_path = "/home/clio/images/profile pictures/2f1b5f16c0afaf1fa89a3c24aadd4963.webp"
button_borders = false
card_borders = false
corner_radius_scale = 0.70000001043081284
font_family = "CozetteVector"
input_borders = false
password_style = "random"
polkit_agent = true
popup_borders = false
show_location = false

    [shell.animation]
    speed = 1.5000000223517418

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    list_item_background = true
    open_near_click_clipboard = true
    shadow = false
    transparency_mode = "soft"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Ayu"
community_palette = "Breeze"
mode = "dark"
pure_black_dark = true
shell_mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    enable_builtin_templates = false

[wallpaper]
directory = "/home/clio/nixosDotfiles/assets/wallpapers"

    [wallpaper.default]
    path = "/home/clio/nixosDotfiles/assets/wallpapers/yamada-ryo.jpg"

    [wallpaper.last]
    path = "/home/clio/nixosDotfiles/assets/wallpapers/yamada-ryo.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/clio/nixosDotfiles/assets/wallpapers/yamada-ryo.jpg"

[widget.Spacer]
type = "spacer"

[widget.Spacer2]
type = "spacer"

[widget.media]
anchor = true
art_size = 8
interactive = false
max_length = 800
title_scroll = "on_hover"

[widget.network]
show_label = false
vpn_status = "both"

[widget.tray]
drawer = true

[widget.weather]
show_condition = false
