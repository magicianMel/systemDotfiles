[audio]
enable_sounds = true
notification_sound = "~/nixosDotfiles/assets/sounds/notification.wav"

[backdrop]
blur_intensity = 0.0
enabled = true
tint_intensity = 0.31999999284744263

[bar]
order = [ "Home" ]

    [bar.Home]
    background_opacity = 0.0
    capsule = true
    capsule_fill = "on_primary"
    capsule_opacity = 0.46999998949468136
    capsule_radius = 12
    capsule_thickness = 0.99999998137354851
    center = [ "media", "weather" ]
    color = "#C99C01"
    end = [
        "tray",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "Spacer2",
        "clock",
        "Spacer",
        "session",
        "notifications"
    ]
    font_scale = 1.0399999842047691
    margin_edge = 3
    margin_ends = 61
    padding = 15
    radius = 35
    scale = 1.1000000089406967
    shadow = false
    start = [ "workspaces", "control-center" ]

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

    [calendar.account.local_calendar]
    name = "Birthdays"
    type = "vdir"

    [calendar.account.personal_google]
    name = "calendar"
    type = "google"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "notification"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 208.0
    box_width = 1088.0
    cx = 1816.0
    cy = 540.0
    output = "DP-3"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = -1.5707963705062866
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        background_opacity = 0.0
        bands = 84
        centered = false
        mirrored = false
        reversed = true
        show_when_idle = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 15

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[location]
auto_locate = true

